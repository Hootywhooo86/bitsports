name: Android APK

# Tests, builds the family-signed release APK, and publishes it to Releases whenever its
# versionName is new (or a v* tag is pushed).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode family signing key
        env:
          KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::FAMILY_KEYSTORE_* secrets are missing; release builds must be signed with the family key."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/family.jks"
          echo "FAMILY_KEYSTORE_PATH=$RUNNER_TEMP/family.jks" >> "$GITHUB_ENV"

      - name: Version code
        run: echo "BITSPORTS_VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          FAMILY_KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
          FAMILY_KEY_ALIAS: ${{ secrets.FAMILY_KEY_ALIAS }}
          FAMILY_KEY_PASSWORD: ${{ secrets.FAMILY_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "bitsports-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bitsports-apk
          path: android/bitsports-v*.apk
          if-no-files-found: error

      # Every new versionName gets a Release with the APK attached, from whichever branch built it
      # first; pushing a v* tag still publishes too. Rebuilds of a version that's already out don't.
      - name: Is this version released yet?
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Releases
        if: startsWith(github.ref, 'refs/tags/v') || steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          target_commitish: ${{ github.sha }}
          name: bitsports ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION) }}
          make_latest: true
          files: android/bitsports-v*.apk
          body_path: RELEASE_NOTES.md
